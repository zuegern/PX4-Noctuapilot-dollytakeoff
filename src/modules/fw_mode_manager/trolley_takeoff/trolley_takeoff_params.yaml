module_name: trolley_takeoff
parameters:
- group: Trolley Takeoff
  definitions:
    TROLLEY_ALN_THR:
      description:
        short: Trolley alignment taxi throttle
        long: |-
          Throttle used during the trolley path-alignment taxi phase.

          When greater than zero and a closed-loop path steering mode (TROLLEY_STR_MODE 1 or 3) is selected, trolley takeoff starts with a low-speed taxi phase that steers the trolley onto the selected path direction before the throttle ramp begins. The phase completes once the path heading error stays below TROLLEY_ALN_ERR, and the path is re-anchored at the aligned position. Set to zero to disable the alignment phase and ramp up immediately.
      type: float
      default: 0.15
      unit: norm
      min: 0.0
      max: 0.5
      decimal: 2
      increment: 0.01
    TROLLEY_ALN_ERR:
      description:
        short: Trolley alignment heading tolerance
        long: |-
          Maximum absolute path heading error that counts as aligned during the trolley alignment taxi phase.

          The error must stay below this threshold for half a second before the throttle ramp starts.
      type: float
      default: 10.0
      unit: deg
      min: 1.0
      max: 45.0
      decimal: 1
      increment: 0.5
    TROLLEY_ALN_TO:
      description:
        short: Trolley alignment timeout
        long: |-
          Maximum duration of the trolley alignment taxi phase.

          If the trolley has not aligned with the path within this time, trolley takeoff aborts. Choose enough time for the trolley to overcome static friction and complete the largest expected alignment turn at taxi speed.
      type: float
      default: 30.0
      unit: s
      min: 1.0
      max: 120.0
      decimal: 1
      increment: 1.0
    TROLLEY_MAX_THR:
      description:
        short: Throttle during trolley takeoff
      type: float
      default: 1.0
      unit: norm
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.01
    TROLLEY_PSP:
      description:
        short: Pitch setpoint while attached to trolley
        long: |-
          Pitch setpoint before trolley release or takeoff rotation airspeed is reached.

          This setpoint is only used while the aircraft is physically attached to the trolley. Once trolley takeoff enters climbout, PX4 transitions to the normal fixed-wing climbout pitch limits over TROLLEY_ROT_TIME.
      type: float
      default: 0.0
      unit: deg
      min: -10.0
      max: 20.0
      decimal: 1
      increment: 0.5
    TROLLEY_RAMP_TM:
      description:
        short: Throttle ramp up time for trolley takeoff
      type: float
      default: 2.0
      unit: s
      min: 1.0
      max: 15.0
      decimal: 2
      increment: 0.1
    TROLLEY_NUDGE:
      description:
        short: Enable yaw stick nudging during trolley ground roll
        long: |-
          Enables yaw stick nudging of the wheel steering command while trolley takeoff is active.
      type: boolean
      default: 1
    TROLLEY_TK_COND:
      description:
        short: Trolley takeoff release condition
        long: |-
          Selects the condition that moves trolley takeoff from ground roll into climbout.

          Airspeed is the normal fixed-wing takeoff behavior. Estimated ground speed and time are test-only options for trolley bench or push tests.
      type: enum
      values:
        0: Airspeed
        1: Estimated ground speed
        2: Time since trolley takeoff start
      default: 0
      min: 0
      max: 2
    TROLLEY_ROT_ASPD:
      description:
        short: Trolley takeoff rotation airspeed
        long: |-
          The calibrated airspeed threshold during trolley ground roll when the plane should start rotating.
          Must be less than the takeoff airspeed, otherwise it is capped at FW_TKO_AIRSPD.

          If set <= 0.0, defaults to 0.9 * FW_TKO_AIRSPD.
      type: float
      default: -1.0
      unit: m/s
      min: -1.0
      decimal: 1
      increment: 0.1
    TROLLEY_ROT_GSPD:
      description:
        short: Trolley takeoff rotation ground speed
        long: |-
          Estimated horizontal ground speed threshold for the test-only ground speed release condition.

          This uses the local velocity estimate, not a wheel encoder. It can drift without external aiding and is only intended for testing.
          Curved trolley motion can make the estimate worse because the IMU also measures lateral/centripetal acceleration.

          If set <= 0.0, defaults to the same threshold as the airspeed condition.
      type: float
      default: -1.0
      unit: m/s
      min: -1.0
      decimal: 1
      increment: 0.1
    TROLLEY_RLS_HOLD:
      description:
        short: Trolley release condition hold time
        long: |-
          Time the airspeed or ground-speed release condition must stay continuously true before trolley takeoff enters climbout.

          This filters short gusts and estimation spikes so a single sample above the release threshold does not trigger rotation. It is not applied to the test-only time condition. Set to zero to release on the first sample above the threshold.
      type: float
      default: 0.2
      unit: s
      min: 0.0
      max: 2.0
      decimal: 2
      increment: 0.05
    TROLLEY_TK_TIME:
      description:
        short: Trolley takeoff release time
        long: |-
          Time from throttle ramp start to enter climbout when TROLLEY_TK_COND is set to the test-only time condition. A preceding alignment taxi phase does not count toward this time.
      type: float
      default: 5.0
      unit: s
      min: 0.0
      max: 120.0
      decimal: 1
      increment: 0.5
    TROLLEY_ROT_TIME:
      description:
        short: Trolley takeoff rotation time
        long: |-
          Time used to linearly transition from the attached trolley pitch constraint to the normal fixed-wing climbout pitch constraints after release.
      type: float
      default: 1.0
      unit: s
      min: 0.1
      max: 10.0
      decimal: 1
      increment: 0.1
    TROLLEY_STR_MODE:
      description:
        short: Trolley steering mode
        long: |-
          Selects how the trolley wheel steering command is generated during trolley takeoff.

          Heading hold is the default runway-style behavior and uses the existing fixed-wing wheel controller to hold the initial heading. It requires FW_W_EN.
          Closed-loop path tracking uses the local position and heading estimate, curvature feedforward, and heading/cross-track feedback to follow the selected straight or constant-radius trolley path.
          Closed-loop path tracking aborts before release if position, horizontal velocity, or heading becomes invalid, the cross-track limit is exceeded, or a configured lateral-acceleration limit makes the requested path infeasible.
          Open-loop path directly commands the selected straight or constant-radius trolley path and is intended for no-GPS steering tests.
          PX4 PIFF path tracking converts path curvature and cross-track error into a changing yaw setpoint and yaw-rate feedforward, then uses the existing fixed-wing PIFF wheel controller. It requires FW_W_EN, has the same navigation, deviation, steering-feasibility, and lateral-acceleration guards as closed-loop path tracking, and aborts before release if the required nominal yaw rate exceeds FW_W_RMAX.
      type: enum
      values:
        0: Heading hold
        1: Closed-loop path tracking
        2: Open-loop path
        3: PX4 PIFF path tracking
      default: 0
      min: 0
      max: 3
    TROLLEY_PATH:
      description:
        short: Trolley steering path
        long: |-
          Selects the trolley steering path used while the aircraft is attached to the trolley.
      type: enum
      values:
        0: Straight
        1: Constant radius right turn
        2: Constant radius left turn
      default: 0
      min: 0
      max: 2
    TROLLEY_RADIUS:
      description:
        short: Trolley turn radius
        long: |-
          Turn radius for the constant-radius trolley path of the PX4 position reference point on the trolley centerline.

          This is not the radius of the inner or outer wheel. If this is set smaller than the radius physically possible with TROLLEY_WB, TROLLEY_REF_X, and TROLLEY_STR_MAX, the controller uses the minimum possible radius instead.
          Steering angle is calculated from the rear-axle centerline radius using a bicycle model.
      type: float
      default: 10.0
      unit: m
      min: 0.1
      max: 200.0
      decimal: 2
      increment: 0.1
    TROLLEY_WB:
      description:
        short: Trolley wheelbase
        long: Distance between the front steering axle and the rear axle.
      type: float
      default: 0.68
      unit: m
      min: 0.01
      max: 20.0
      decimal: 3
      increment: 0.01
    TROLLEY_REF_X:
      description:
        short: Trolley reference longitudinal offset
        long: |-
          Forward distance from the rear axle to the PX4 position reference point on the trolley centerline.

          Set this if the IMU/GPS/UAV reference is ahead of the rear axle. Left/right wheel radius differences are not configured here because the reference point is assumed to be centered laterally.

          Direct closed-loop path tracking implements a published sufficient stability condition for reference points at or ahead of the rear axle. PX4 PIFF path tracking uses the same offset geometry, so negative offsets are not supported.
      type: float
      default: 0.0
      unit: m
      min: 0.0
      max: 20.0
      decimal: 3
      increment: 0.01
    TROLLEY_STR_MAX:
      description:
        short: Trolley maximum wheel steering angle
        long: |-
          Maximum physical steering angle of the trolley wheels. Direct path steering is normalized by this value and constrained to [-1, 1]. PX4 PIFF path tracking uses it to reject an infeasible curve.

          This is the wheel angle, not the servo horn angle. Use output min/center/max calibration for each servo to avoid overdriving the mechanical stops.
      type: float
      default: 20.0
      unit: deg
      min: 1.0
      max: 45.0
      decimal: 1
      increment: 0.5
    TROLLEY_TRK_GAIN:
      description:
        short: Trolley path heading feedback gain
        long: |-
          Positive magnitude of the heading-error feedback used by direct closed-loop trolley path tracking.

          The controller applies the negative feedback sign internally. It must be greater than zero in direct closed-loop mode. Start with a low positive value and increase carefully during low-speed tests. This only applies when TROLLEY_STR_MODE is set to 1.

          The default was lowered from 1.0 to 0.6 after RTK push tests showed the wheel command faithfully mirroring the natural yaw wobble of the hand-pushed trolley, producing jittery steering at near-unity gain.
      type: float
      default: 0.6
      min: 0.0
      max: 5.0
      decimal: 2
      increment: 0.1
    TROLLEY_XTK_GAIN:
      description:
        short: Trolley cross-track feedback gain
        long: |-
          Converts signed cross-track error into a bounded heading correction for both closed-loop trolley path controllers.

          This gain has units of inverse metres. In direct closed-loop mode it must be greater than the sufficient constant-curvature stability threshold calculated from TROLLEY_WB, TROLLEY_REF_X, and TROLLEY_STR_MAX; PX4 aborts before release if that condition is not met. In PX4 PIFF path mode it sets the path-error-to-yaw correction, while yaw and yaw-rate control use FW_WR_P, FW_WR_I, FW_WR_FF, and FW_W_RMAX.

          The default was lowered from 0.5 to 0.2 after RTK push tests: with cm-level position the trolley tracked the line to about +/-0.13 m even at 0.2, and the higher gain drove the steering close to saturation for only a few tenths of a metre of error, causing abrupt turns. This is still an order of magnitude above the stability threshold for the current trolley geometry.
      type: float
      default: 0.2
      min: 0.0
      max: 10.0
      decimal: 2
      increment: 0.05
    TROLLEY_LAT_ACC:
      description:
        short: Trolley maximum lateral acceleration
        long: |-
          Optional lateral-acceleration limit for trolley steering.

          When greater than zero, the steering-angle limit decreases with the estimated body-longitudinal speed to limit acceleration at the rear axle center. Both closed-loop path modes abort before release if the selected constant-radius path cannot satisfy this limit. Set to a negative value to disable.

          Enabled by default at 2.5 m/s^2 (about 0.25 g) as an anti-tip limit: at higher taxi speeds a full steering deflection produces a hard lateral jerk that can tip the UAV or slide it off the trolley, so the steering angle is capped to keep the rear-axle lateral acceleration below this value. A straight reference path never triggers the pre-release abort; only an infeasibly tight commanded curve does. Raise once a trolley-specific tip limit has been measured.
      type: float
      default: 2.5
      unit: m/s^2
      min: -1.0
      max: 20.0
      decimal: 2
      increment: 0.1
    TROLLEY_XTK_MAX:
      description:
        short: Trolley maximum cross-track error
        long: |-
          Maximum absolute path deviation allowed during closed-loop trolley ground roll in mode 1 or 3.

          Exceeding this limit before release aborts trolley takeoff. Set to zero to disable this guard only during controlled low-speed development tests.
      type: float
      default: 2.0
      unit: m
      min: 0.0
      max: 20.0
      decimal: 2
      increment: 0.1
    TROLLEY_STR_RATE:
      description:
        short: Trolley steering command slew rate
        long: |-
          Limits how quickly the direct trolley steering command can change, in normalized units per second. Set to 0 or a negative value to disable.

          The default was lowered from 1.0 to 0.4 (full-range sweep in about 5 s instead of 2 s) to mechanically smooth the wheel motion and reduce the risk of an abrupt turn tipping the UAV or sliding it off the trolley.
      type: float
      default: 0.4
      min: -1.0
      max: 20.0
      decimal: 2
      increment: 0.1
    TROLLEY_STR_VLO:
      description:
        short: Trolley steering feedback zero-authority speed
        long: |-
          Body-longitudinal speed at or below which the closed-loop path-steering feedback is faded to zero in direct closed-loop mode (TROLLEY_STR_MODE 1).

          At very low speed the heading estimate is noisy and the steered wheels produce almost no yaw rate, so a fixed-gain command there only produces jitter and can store up a large deflection that lurches once the trolley accelerates. The geometric curvature feedforward is never faded, so a curved reference is still tracked. The feedback ramps linearly from zero at this speed to full authority at TROLLEY_STR_VHI. Set TROLLEY_STR_VHI to zero to disable the fade.
      type: float
      default: 0.5
      unit: m/s
      min: 0.0
      max: 10.0
      decimal: 2
      increment: 0.1
    TROLLEY_STR_VHI:
      description:
        short: Trolley steering feedback full-authority speed
        long: |-
          Body-longitudinal speed at or above which the closed-loop path-steering feedback reaches full authority in direct closed-loop mode (TROLLEY_STR_MODE 1).

          Between TROLLEY_STR_VLO and this speed the feedback gain is scaled linearly from zero to one. Must be greater than TROLLEY_STR_VLO. Set to zero (or a non-positive value) to disable the speed-dependent fade and apply full feedback at all speeds.
      type: float
      default: 2.0
      unit: m/s
      min: 0.0
      max: 20.0
      decimal: 2
      increment: 0.1
    TROLLEY_STR_HOLD:
      description:
        short: Trolley straight steering hold time
        long: |-
          Time to keep commanding neutral wheel steering after trolley takeoff enters climbout.

          This gives the trolley steering servos time to return to straight before the physical connector separates.
      type: float
      default: 0.5
      unit: s
      min: 0.0
      max: 5.0
      decimal: 2
      increment: 0.1
    TROLLEY_SRV_CTL:
      description:
        short: Trolley steering servo control source
        long: |-
          Selects how trolley steering servos are controlled during trolley takeoff.

          Direct Pixhawk PWM uses the fixed-wing wheel steering output, so assign the trolley steering servos to Landing Gear Wheel outputs in QGroundControl. This is the same direct-servo setup used before the Raspberry Pi Pico helper.
          Raspberry Pi Pico serial sends the trolley steering command to the Pico over a UART and uses bidirectional command/status heartbeats as the trolley connection monitor. If either link direction is lost before trolley release, trolley takeoff aborts. If the link is lost after release, it is treated as the expected disconnect.
          Raspberry Pi Pico I2C uses the same packets and connection monitoring over an I2C bus, with PX4 as the master and the Pico as a slave device on TROLLEY_I2C_BUS at TROLLEY_I2C_ADDR. Use this when no serial port is free. The Pico sketch must be built with its I2C link option.
      type: enum
      values:
        0: Direct Pixhawk PWM
        1: Raspberry Pi Pico serial
        2: Raspberry Pi Pico I2C
      default: 1
      min: 0
      max: 2
    TROLLEY_COM_PORT:
      description:
        short: Trolley Pico serial port
        long: |-
          Selects the Pixhawk 6C serial port used for the trolley Raspberry Pi Pico servo controller.

          The selected port must not also be used by MAVLink, GPS, or another driver.
      type: enum
      values:
        1: TELEM2
        2: TELEM3
        3: TELEM1
        4: GPS2
        5: GPS1
      default: 1
      min: 1
      max: 5
    TROLLEY_COM_BAUD:
      description:
        short: Trolley Pico serial baud rate
        long: |-
          Baud rate for the trolley Raspberry Pi Pico servo-controller serial link.
      type: enum
      values:
        57600: 57600
        115200: 115200
        230400: 230400
        460800: 460800
        921600: 921600
      default: 115200
      min: 57600
      max: 921600
    TROLLEY_I2C_BUS:
      description:
        short: Trolley Pico I2C bus
        long: |-
          External I2C bus used for the trolley Raspberry Pi Pico when TROLLEY_SRV_CTL is set to Raspberry Pi Pico I2C.

          On the Pixhawk 6C, bus 2 is on the dedicated 4-pin I2C port of current units and on the GPS2 connector SCL/SDA pins; bus 1 is on the GPS1 connector. Exception: 6C units with serial numbers up to pattern ...20221100 wire the dedicated port to bus 4 instead - verify with i2cdetect. Do not use bus 4: it carries the internal barometer and magnetometer. Prefer the external bus with the fewest flight-critical sensors, because a fault on the trolley stub disturbs every device on the shared bus until the connector separates.
      type: int32
      default: 2
      min: 1
      max: 4
    TROLLEY_I2C_ADDR:
      description:
        short: Trolley Pico I2C address
        long: |-
          7-bit I2C slave address of the trolley Raspberry Pi Pico. Must match the address in the Pico sketch and must not collide with any other device on the same bus; writes to a foreign sensor at this address could misconfigure it. The default 0x3B (59) avoids common PX4 sensor addresses.
      type: int32
      default: 59
      min: 8
      max: 119
    TROLLEY_COM_LOSS:
      description:
        short: Trolley Pico link-loss timeout
        long: |-
          Maximum time without a valid Raspberry Pi Pico status packet before PX4 considers the trolley link lost. Applies to both the serial and the I2C link.

          Keep this short enough to detect a bad disconnect before the trolley accelerates far, but long enough to tolerate a few dropped serial packets.
      type: float
      default: 0.20
      unit: s
      min: 0.05
      max: 1.0
      decimal: 2
      increment: 0.01
